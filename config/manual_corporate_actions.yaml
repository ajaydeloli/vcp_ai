# Human-verified corporate actions missing from NSE's feeds (DATA_SPECIFICATION 18A, audit 2.7d).
#
# Each entry becomes a raw action with source MANUAL; reconciliation marks its (type, ex-date)
# MANUAL_OVERRIDE, which feeds adjustment factors and wins over feed values for the same key.
# Ratio conventions are the NSE parser's:
#   SPLIT  [old face value, new face value]   Rs 10 -> Rs 2 is [10, 2]; consolidation Re 1 -> Rs 10 is [1, 10]
#   BONUS  [bonus shares, shares held]        1 bonus for every 2 held is [1, 2]
#   RIGHTS [rights shares, shares held] with cash_amount = issue price (face value + premium)
#   DEMERGER: no ratio; price_factor = the parent's price after / before (0 < f <= 1)
# The ex-date is the first session the shares trade without the entitlement (with T+1
# settlement, NSE's ex-date equals the record date). Check it against the bhavcopy: the price
# jump, and for a split the ISIN change, fall on it.
# Every entry needs evidence (notice URL or source) and who approved it.

actions:
  - symbol: DTIL
    isin: INE341R01014
    action_type: BONUS
    ex_date: 2021-08-05
    ratio: [1, 2]
    evidence: >-
      Board approved a 1:2 bonus (one bonus share for every two held) on 2021-06-29
      (Business Standard, 2021-06-29). Bhavcopy: close 521.15 on 2021-08-04, open 330.00 on
      2021-08-05; 521.15 x 2/3 = 347.4. Not in NSE's corporate-action feed.
    approved_by: Ajay
    entered_on: 2026-10-01

  - symbol: GICL
