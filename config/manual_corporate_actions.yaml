# Human-verified corporate actions missing from NSE's feeds (DATA_SPECIFICATION 18A, audit 2.7d).
#
# Each entry becomes a raw action with source MANUAL; reconciliation marks its (type, ex-date)
# MANUAL_OVERRIDE, which feeds adjustment factors and wins over feed values for the same key.
# Ratio conventions are the NSE parser's:
#   SPLIT  [old face value, new face value]   Rs 10 -> Rs 2 is [10, 2]; consolidation Re 1 -> Rs 10 is [1, 10]
#   BONUS  [bonus shares, shares held]        1 bonus for every 2 held is [1, 2]
#   RIGHTS [rights shares, shares held] with cash_amount = issue price (face value + premium)
#   DEMERGER: no ratio; price_factor = the parent's price after / before (0 < f <= 1)
#   CAPITAL_REDUCTION: no ratio, never adjusts prices; reduction_kind (VOLUNTARY_TENDER,
#     IBC_RESOLUTION_PLAN, OTHER), optional shares_before/shares_after, cash_amount = cash per
#     cancelled share. Keeps a warning marked "reviewed".
# The ex-date is the first session the shares trade without the entitlement (with T+1
# settlement, NSE's ex-date equals the record date). Check it against the bhavcopy: the price
# jump, and for a split the ISIN change, fall on it.
# Every entry needs evidence (notice URL or source) and who approved it.

actions:
  - symbol: DTIL
    isin: INE341R01014
    action_type: BONUS
    ex_date: 2021-08-05
    ratio: [1, 2]
    evidence: >-
      Board approved a 1:2 bonus (one bonus share for every two held) on 2021-06-29
      (Business Standard, 2021-06-29). Bhavcopy: close 521.15 on 2021-08-04, open 330.00 on
      2021-08-05; 521.15 x 2/3 = 347.4. Not in NSE's corporate-action feed.
    approved_by: Ajay
    entered_on: 2026-10-01

  - symbol: GICL
    isin: INE947T01014
    action_type: SPLIT
    ex_date: 2025-10-15
    ratio: [10, 5]
    evidence: >-
      NSE record-date notice https://nsearchives.nseindia.com/corporate/GICL_24092025171948_Intimation_Record_Date.pdf
      (split of each Rs 10 share into 2 shares of Rs 5, with a 1:1 bonus). Bhavcopy: ISIN
      INE947T01014 -> INE947T01022 and close 173.70 -> open 46.00 on 2025-10-15.
    approved_by: Ajay
    entered_on: 2026-10-01

  - symbol: GICL
    isin: INE947T01014
    action_type: BONUS
    ex_date: 2025-10-15
    ratio: [1, 1]
    evidence: >-
      Same NSE notice as the GICL split: bonus 1:1 of Rs 5 shares. Split and bonus together
      give factor 1/4: 173.70 / 4 = 43.4 against an open of 46.00.
    approved_by: Ajay
    entered_on: 2026-10-01

  - symbol: JSLL
    isin: INE0J5801011
    action_type: SPLIT
    ex_date: 2025-06-12
    ratio: [10, 2]
    evidence: >-
      NSE record-date notice https://nsearchives.nseindia.com/corporate/JEENASIKHO_24052025183909_Record_Date_Notice.pdf
      (each Rs 10 share split into 5 shares of Rs 2, record date 2025-06-12). Bhavcopy: ISIN
      INE0J5801011 -> INE0J5801029 and close 2250.95 -> open 460.00 on 2025-06-12.
    approved_by: Ajay
    entered_on: 2026-10-01

  # Capital reductions: reviewed records, never a price adjustment (owner decision 2026-10-02).
  - symbol: MAXIND
    action_type: CAPITAL_REDUCTION
    ex_date: 2022-07-26
    reduction_kind: VOLUNTARY_TENDER
    shares_before: 53786261
    shares_after: 43029009
    cash_amount: 85
    evidence: >-
      NCLT-approved capital reduction (NSE record "Capital Reduction Pursuant To NCLT Order",
      ex 2022-07-26). Up to 20 % of the shares could be cancelled against tender at Rs 85
      each; the cap of 1,07,57,252 shares was cancelled (5,37,86,261 -> 4,30,29,009). Tender
      with cash consideration, not a split: no price factor. Sources: NSE India archives,
      Goodreturns (owner research 2026-10-02).
    approved_by: Ajay
    entered_on: 2026-10-02

  - symbol: EASTSILK
    action_type: CAPITAL_REDUCTION
    ex_date: 2024-11-22
    reduction_kind: IBC_RESOLUTION_PLAN
    evidence: >-
      Capital reduction under the NCLT-approved resolution plan (NSE record "Capital
      Reduction", ex 2024-11-22): the existing equity was extinguished and 50,00,000 new Rs 2
      shares were issued to the successful resolution applicant. Not representable as a split;
      the stock returned on 2025-08-18 under ISIN INE962C01035 after 357 missed sessions
      (TRADING_ABSENCE restarts its history). Source: NSE India archives (owner research
      2026-10-02).
    approved_by: Ajay
    entered_on: 2026-10-02

  # Demerger reviewed by hand: no price factor can be measured (owner decision 2026-10-02).
  - symbol: UEL
    action_type: DEMERGER
    ex_date: 2024-05-22
    price_factor: 1.0
    evidence: >-
      Demerger implemented under the IBC resolution plan, record date 2024-05-22 (Value
      Research). The ex-date price rose (43.80 on 2024-05-21 -> 153.30 open on 2024-05-27,
      upper-circuit relisting), so no demerged value can be measured from prices; factor 1.0
      (no adjustment) until a scheme-derived factor is available. The +250 % gap stays a
      warning.
    approved_by: Ajay
    entered_on: 2026-10-02
