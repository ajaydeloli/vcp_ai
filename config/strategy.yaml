# strategy.yaml - Technical Gates, Pattern Thresholds and Classification
# Specification baseline: TREND_TEMPLATE_SPECIFICATION.md, PROJECT_DESIGN.md

trend_template:
  required: true
  min_rs_rank: 70
  stricter_rs_rank: 80
  sma200_slope_lookback_days: 21
  min_above_52w_low_pct: 25.0
  max_below_52w_high_pct: 25.0
  extreme_basis: high_low

rs:
  version: rs-1.1.0
  windows_days: [63, 126, 189, 252]
  weights: [0.40, 0.20, 0.20, 0.20]
  min_history_days: 253

stage:
  sma_weeks: 30
  slope_lookback_weeks: 4
  flat_band_pct: 0.5
  prior_advance_min_pct: 10.0

# VCP detector (Phase 6) and classification: shape and values verbatim from
# VCP_SPECIFICATION.md section 60 (audit 2026-09-30 Fix 7). All values are hypotheses.
vcp:
  contractions:
    min: 2
    max: 6

  swing:
    left_bars: 5
    right_bars: 5
    min_depth_pct: 2.0
    min_duration_days: 3
    short_swing_max_depth_pct: 4.0

  progressive_tolerance_pct: 10

  volatility:
    atr_period: 14
    contraction_ratio_max: 0.80
    measure: true_range

  volume:
    short_period: 5
    medium_period: 20
    long_period: 50
    dryup_ratio: 0.70

  pivot:
    max_distance_pct: 3.0
    right_side_window_days: 10
    max_right_side_range_pct: 5.0
    level_tolerance_pct: 1.5

  confirmation:
    allow_provisional_final_contraction: true
    include_provisional_in_ranking: false

  prior_advance:
    enabled: true
    lookback_days: 120
    min_return_pct: 20

  base:
    max_duration_days: 130

  invalidation:
    trend_template_failure: true
    base_low_break_pct: 2.0
    volatility_expansion_multiple: 2.0

classification:
  a_plus:
    min_contractions: 3
    max_contractions: 6
    max_final_contraction_pct: 8
    require_progressive_tightening: true
    require_volume_dryup: true
    require_volatility_contraction: true
    require_tight_pivot: true

  vcp:
    min_contractions: 2
    max_contractions: 6
    max_final_contraction_pct: 12
    require_progressive_tightening: true
    require_tight_pivot: true

  vcp_like:
    min_contractions: 2
    max_final_contraction_pct: 15
