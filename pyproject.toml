[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcp-scanner"
version = "0.1.0"
description = "Institutional-grade NSE VCP scanner (Minervini Trend Template + Volatility Contraction Pattern)"
readme = "README.md"
requires-python = ">=3.11"
# Phase 1 dependencies. Justification:
#   pydantic  - schema/range/cross-field config validation (PROJECT_DESIGN 47)
#   pyyaml    - YAML configuration files (PROJECT_DESIGN 45)
#   duckdb    - analytical SQL + Parquet queries (DATABASE_SCHEMA §3; Phase 1)
#   pyarrow   - columnar Parquet storage layer (DATABASE_SCHEMA §3; Phase 1)
# Provider SDKs (Kite/Dhan) remain behind adapters in Phase 1+.
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "duckdb>=1.1,<2",
    "pyarrow>=17,<20",
    "pytz>=2024",  # required by DuckDB for TIMESTAMPTZ Python binding
    "kiteconnect>=5.0.0",
    "python-dotenv>=1.0",
    "requests>=2.31",  # NSE / Upstox HTTP providers
    "fastapi>=0.110",  # read-only dashboard API (FRONTEND_SPECIFICATION 67)
    "uvicorn>=0.29",  # serves it (`vcp api serve`)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "httpx>=0.27",  # FastAPI's TestClient
]

[project.scripts]
vcp = "vcp_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vcp_scanner = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: exercises several modules together",
    "regression: golden-dataset regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# scratch/ holds throwaway exploration scripts, not project code.
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Column-aligned SQL window definitions read better than wrapped ones.
"src/vcp_scanner/data/features/daily_features.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kiteconnect", "kiteconnect.*"]
ignore_missing_imports = true
